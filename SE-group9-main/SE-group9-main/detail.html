<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Thuyết Minh Công Trình</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col justify-between">

  <!-- Navigation -->
  <header class="p-4 flex justify-between items-center border-b border-slate-800">
    <a href="index.html" class="text-xs text-amber-400 font-bold flex items-center gap-1">
      <i class="fa-solid fa-arrow-left"></i> Danh sách
    </a>
    <span id="detail-code" class="bg-amber-400 text-slate-900 text-[10px] font-extrabold px-2 py-0.5 rounded">DDL-01</span>
  </header>

  <!-- Nội dung Thuyết minh -->
  <main class="max-w-lg mx-auto px-4 py-8 text-center flex-1 flex flex-col justify-center">
    <div class="mb-6">
      <span class="text-xs text-amber-400 font-semibold tracking-wider uppercase">Dinh Độc Lập - Thuyết Minh Tự Động</span>
      <h1 id="detail-title" class="text-3xl font-extrabold text-white mt-1">Phòng Khánh Tiết</h1>
      <p id="detail-location" class="text-xs text-slate-400 mt-2 flex items-center justify-center gap-1">
        <i class="fa-solid fa-location-dot text-amber-400"></i> Tầng trệt - Dinh Độc Lập
      </p>
    </div>

    <!-- Khung trình phát Audio -->
    <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-2xl mb-6">
      <div class="w-16 h-16 bg-amber-500 text-slate-900 rounded-full flex items-center justify-center text-2xl mx-auto mb-4 shadow-lg animate-pulse">
        <i class="fa-solid fa-headphones"></i>
      </div>
      <p id="detail-desc" class="text-slate-300 text-sm leading-relaxed mb-6 text-left bg-slate-900/60 p-4 rounded-xl border border-slate-700">
        Đang tải thông tin...
      </p>

      <div class="flex justify-center gap-3">
        <button onclick="playVoice()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-6 py-3 rounded-xl transition flex items-center gap-2 shadow">
          <i class="fa-solid fa-play"></i> Phát Thuyết Minh
        </button>

        <button onclick="stopVoice()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 py-3 rounded-xl transition">
          <i class="fa-solid fa-square"></i> Dừng
        </button>
      </div>
    </div>
  </main>

  <footer class="p-4 text-center text-xs text-slate-500 border-t border-slate-800">
    © Đồ án Thuyết minh Tự động - ĐH Sài Gòn
  </footer>

  <script>
    const data = [
      { code: "DDL-01", name: "Phòng Khánh Tiết", location: "Tầng trệt - Dinh Độc Lập", description: "Phòng Khánh Tiết là không gian lớn nhất tại Dinh Độc Lập với sức chứa lên đến 500 người. Đây là nơi diễn ra các lễ ra mắt cabinet, hội nghị quốc tế và các buổi dạ yến lịch sử." },
      { code: "DDL-02", name: "Phòng Trình Quốc Thư", location: "Tầng 2 - Dinh Độc Lập", description: "Phòng Trình Quốc Thư là nơi Tổng thống nhận quốc thư của đại sứ các nước. Bức tranh sơn mài 'Bình Ngô Đại Cáo' trang trí trên tường mang đậm nét nghệ thuật truyền thống." },
      { code: "DDL-03", name: "Phòng Hợp Hội Đồng Bộ Trưởng", location: "Tầng 2 - Dinh Độc Lập", description: "Nơi diễn ra các phiên họp kín của Nội các chính quyền Sài Gòn cũ với hệ thống tai nghe phiên dịch đa ngôn ngữ hiện đại thời bấy giờ." },
      { code: "DDL-04", name: "Bến Đáp Trực Thăng & F5E", location: "Tầng sân thượng - Dinh Độc Lập", description: "Nơi đỗ chiếc trực thăng UH-1. Ghi dấu sự kiện phi công Nguyễn Thành Trung lái máy bay F5E ném bom vào sáng ngày 8 tháng 4 năm 1975." },
      { code: "DDL-05", name: "Xe Tăng 390 & Cổng Chính", location: "Khuôn viên bãi cỏ phía trước", description: "Chiếc xe tăng 390 huyền thoại đã húc văng cổng phụ Dinh Độc Lập vào lúc 10 giờ 45 phút ngày 30/4/1975, đánh dấu thời khắc hoàn toàn giải phóng miền Nam." },
      { code: "DDL-06", name: "Khu Hầm Tác Chiến Lịch Sử", location: "Tầng hầm - Dinh Độc Lập", description: "Hệ thống hầm kiên cố chịu được bom đạn hạng nặng, chứa đài vô tuyến, bản đồ tác chiến và phòng làm việc của Tổng thống." }
    ];

    let currentItem = data[0];

    function initPage() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');

      if (code) {
        const found = data.find(i => i.code === code);
        if (found) currentItem = found;
      }

      document.getElementById('detail-code').innerText = currentItem.code;
      document.getElementById('detail-title').innerText = currentItem.name;
      document.getElementById('detail-location').innerHTML = `<i class="fa-solid fa-location-dot text-amber-400"></i> ${currentItem.location}`;
      document.getElementById('detail-desc').innerText = currentItem.description;

      // Tự động phát âm thanh sau 0.8s khi điện thoại mở trang
      setTimeout(playVoice, 800);
    }

    function playVoice() {
      stopVoice();
      const utterance = new SpeechSynthesisUtterance(currentItem.description);
      utterance.lang = 'vi-VN';
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    function stopVoice() {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    window.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
